name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Create Flutter project structure
        run: |
          mv lib/main.dart /tmp/main.dart
          mv pubspec.yaml /tmp/pubspec.yaml
          flutter create . --project-name jamb_pro --org com.jamb.pro --template app
          mv /tmp/main.dart lib/main.dart
          mv /tmp/pubspec.yaml pubspec.yaml
          cat pubspec.yaml
      
      - name: Get packages
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jamb-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
