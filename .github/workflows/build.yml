name: Build APK Ultimate
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate Project
        run: |
          mv lib/main.dart /tmp/main.dart
          mv pubspec.yaml /tmp/pubspec.yaml
          flutter create . --project-name jamb_pro --org com.jamb.pro --template app --overwrite
          mv /tmp/main.dart lib/main.dart
          mv /tmp/pubspec.yaml pubspec.yaml
      - name: Get Packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jamb-pro-ultimate-apk
          path: build/app/outputs/flutter-apk/app-release.apk
